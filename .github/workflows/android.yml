# 안드로이드 앱(APK)과 PC 설치 파일(exe)을 자동으로 만들어 [Releases]에 올립니다.
# pc/초과근무기록장.html 이나 android-app/ 을 고쳐서 올리면 저절로 새 APK가 만들어집니다.
name: 앱 만들기 (안드로이드·PC)

on:
  push:
    branches: [main]
    paths: ["android-app/**", "pc/**", "pc-installer/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 안드로이드 SDK 확인 (빌드 서버에 이미 설치됨)
        run: |
          echo "::notice::단계 통과 - 준비 완료 (ANDROID_HOME=$ANDROID_HOME)"
          ls "$ANDROID_HOME/platforms" | tail -3 | tr '\n' ' ' | sed 's/^/::notice::설치된 플랫폼: /'; echo

      - name: 앱 화면 준비 (PC용 HTML → 앱)
        run: |
          set -o pipefail
          { npm ci && python3 prepare-www.py && npx cap sync android; } 2>&1 | tee -a ../build.log
          echo "::notice::단계 통과 - 앱 화면 준비"

      - name: 서명 키 꺼내기 (GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키(ANDROID_KEYSTORE_BASE64)가 없어 테스트용 APK를 만듭니다."
          fi

      - name: APK 만들기
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon assembleRelease 2>&1 | tee -a ../../build.log
            cp app/build/outputs/apk/release/app-release.apk "../overtime-v1.0.${VERSION_CODE}.apk"
          else
            ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee -a ../../build.log
            cp app/build/outputs/apk/debug/app-debug.apk "../overtime-v1.0.${VERSION_CODE}-test.apk"
            # 서명 전 정식(릴리스) 빌드도 함께 올려 둠 → 서명 키로 따로 서명해 배포할 수 있음
            cp app/build/outputs/apk/release/app-release-unsigned.apk "../overtime-v1.0.${VERSION_CODE}-unsigned.apk"
          fi
          rm -f app/release.keystore
          echo "::notice::단계 통과 - APK 만들기"

      - name: PC 설치 파일 만들기
        working-directory: pc-installer
        run: |
          set -o pipefail
          { sudo apt-get update -qq && sudo apt-get install -y nsis && sh build.sh "1.0.${VERSION_CODE}"; } 2>&1 | tee -a ../build.log
          cp "OvertimeLog-v1.0.${VERSION_CODE}.exe" "../android-app/overtime-pc-v1.0.${VERSION_CODE}.exe"
          echo "::notice::단계 통과 - PC 설치 파일"

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls overtime-v*.apk | tr '\n' ' ')
          EXE=$(ls overtime-pc-v*.exe)
          if [ "$SIGNED" = "1" ]; then KIND="정식"; else KIND="테스트용 (서명 키 등록 전)"; fi
          gh release create "v1.0.${VERSION_CODE}" $APK $EXE \
            --title "초과근무 기록장 v1.0.${VERSION_CODE} (${KIND})" \
            --notes "안드로이드: ${APK} 를 휴대폰에 받아 눌러 설치하세요. / PC(윈도우): ${EXE} 를 받아 실행하세요(관리자 권한 필요 없음). 인터넷 없이 동작하며 기록은 각 기기에만 저장됩니다."

      - name: 실패 원인 남기기
        if: failure()
        working-directory: .
        run: |
          touch build.log
          grep -n -i -E "error|failed|exception|what went wrong|could not" build.log | tail -40 > err.txt || true
          [ -s err.txt ] || tail -40 build.log > err.txt
          python3 -c "import sys;t=open('err.txt',encoding='utf-8',errors='replace').read()[-3500:];print('::error title=빌드 실패::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
